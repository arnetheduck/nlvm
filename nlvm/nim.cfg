path:"../"
path:"../lib/nim"
path:"$lib"
path:"$lib/packages/docutils"

define:nimcore
--warning[CStringConv]:off
--dynlibOverrideAll

@if windows:
  passl:"-Wl,--stack=16777216"
@end

cc=clang
passl:"-fuse-ld=lld"

@if staticLLVM:
  @if windows:
    passl:"-static"
  @end
@else:
  passc:"-fPIC"
@end
